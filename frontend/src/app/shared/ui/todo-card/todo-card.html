<article class="card" [class.overdue]="overdue()" [class.done]="todo().done" [class.compact]="density() === 'compact'">
  <button
    type="button"
    class="check"
    [attr.aria-pressed]="todo().done"
    [attr.aria-label]="(todo().done ? 'Mark not done: ' : 'Mark done: ') + todo().name"
    (click)="toggleDone.emit(!todo().done)"
  >
    <span class="box" [class.checked]="todo().done">
      @if (todo().done) {
        <i class="pi pi-check" aria-hidden="true"></i>
      }
    </span>
  </button>

  <div class="content">
    @if (overdue()) {
      <span class="sr-only">Overdue</span>
    }
    <button type="button" class="title" (click)="open.emit()">{{ todo().name }}</button>
    @if (density() === 'comfortable' && todo().description) {
      <p class="desc" [attr.title]="todo().description">{{ firstLine() }}</p>
    }
    <div class="meta" [class.meta-overdue]="overdue()">
      @if (overdue()) {
        <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
        <span>{{ time() }} · Overdue</span>
      } @else {
        <span>{{ time() }}</span>
      }
    </div>
    <div class="tags">
      <app-priority-tag [priority]="todo().priority" />
      @if (recurring()) {
        <app-recurring-tag [summary]="todo().ruleSummary" />
      }
      @if (category(); as c) {
        <app-category-chip [category]="c" size="sm" />
      }
    </div>
  </div>

  <button
    type="button"
    class="more"
    [attr.aria-label]="'More actions for ' + todo().name"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="menu.toggle($event)"
  >
    <i class="pi pi-ellipsis-v" aria-hidden="true"></i>
  </button>
  <p-menu
    #menu
    [model]="menuItems"
    [popup]="true"
    appendTo="body"
    styleClass="todo-card-menu"
    (onShow)="menuOpen.set(true)"
    (onHide)="onMenuHide()"
  />
</article>
