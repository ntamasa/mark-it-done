<app-auth-card title="Log in">
  @if (serverError(); as message) {
    <div #serverErrorEl class="server-error" tabindex="-1" role="alert">
      <p-message severity="error">{{ message }}</p-message>
    </div>
  }
  <form class="form" novalidate (submit)="onSubmit($event)">
    <div class="field">
      <label for="login-email">Email *</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        (input)="serverError.set(null)"
        [formField]="loginForm.email"
        [attr.aria-invalid]="errorOf(loginForm.email) ? 'true' : null"
        [attr.aria-describedby]="errorOf(loginForm.email) ? 'login-email-error' : null"
      />
      @if (errorOf(loginForm.email); as msg) {
        <p class="field-error" id="login-email-error" role="alert">{{ msg }}</p>
      }
    </div>

    <div class="field">
      <div class="label-row">
        <label for="login-password">Password *</label>
        <a class="link-btn" routerLink="/forgot-password">Forgot password?</a>
      </div>
      <div class="password-wrap">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          (input)="serverError.set(null)"
          [formField]="loginForm.password"
          [attr.aria-invalid]="errorOf(loginForm.password) ? 'true' : null"
          [attr.aria-describedby]="errorOf(loginForm.password) ? 'login-password-error' : null"
        />
        <button
          type="button"
          class="eye-btn"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePassword()"
        >
          <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
        </button>
      </div>
      @if (errorOf(loginForm.password); as msg) {
        <p class="field-error" id="login-password-error" role="alert">{{ msg }}</p>
      }
    </div>

    <label class="remember-row" for="login-remember">
      <input id="login-remember" type="checkbox" [formField]="loginForm.rememberMe" (change)="serverError.set(null)" />
      <span>Remember me <span class="remember-hint">· stay signed in for 14 days</span></span>
    </label>

    <p-button
      type="submit"
      styleClass="btn-accent submit-btn"
      [label]="loading() ? 'Please wait…' : 'Log in'"
      [loading]="loading()"
      [fluid]="true"
    />
  </form>
  <a class="secondary-link" routerLink="/register">Create account</a>
</app-auth-card>
