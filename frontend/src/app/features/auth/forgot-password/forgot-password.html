@if (sentTo(); as address) {
  <app-auth-card title="Check your email">
    <div class="status-icon"><i class="pi pi-envelope" aria-hidden="true"></i></div>
    <p class="status-text" aria-live="polite">
      If an account exists for {{ address }}, we've sent a reset link. It expires in 30 minutes.
    </p>
    <a class="secondary-link" routerLink="/login">Back to log in</a>
  </app-auth-card>
} @else {
  <app-auth-card
    title="Forgot password"
    subtitle="Enter your account email and we'll send you a link to reset your password."
  >
    @if (serverError(); as message) {
      <div #serverErrorEl class="server-error" tabindex="-1" role="alert">
        <p-message severity="error">{{ message }}</p-message>
      </div>
    }
    <form class="form" novalidate (submit)="onSubmit($event)">
      <div class="field">
        <label for="forgot-email">Email *</label>
        <input
          id="forgot-email"
          type="email"
          autocomplete="email"
          (input)="serverError.set(null)"
          [formField]="forgotForm.email"
          [attr.aria-invalid]="errorOf(forgotForm.email) ? 'true' : null"
          [attr.aria-describedby]="errorOf(forgotForm.email) ? 'forgot-email-error' : null"
        />
        @if (errorOf(forgotForm.email); as msg) {
          <p class="field-error" id="forgot-email-error" role="alert">{{ msg }}</p>
        }
      </div>
      <p-button
        type="submit"
        styleClass="btn-accent submit-btn"
        [label]="loading() ? 'Please wait…' : 'Send reset link'"
        [loading]="loading()"
        [fluid]="true"
      />
    </form>
    <a class="secondary-link" routerLink="/login">Back to log in</a>
  </app-auth-card>
}
