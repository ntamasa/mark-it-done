---
databaseChangeLog:
- changeSet:
    id: "006-todos"
    author: "markitdone"
    changes:
    - createTable:
        tableName: "todos"
        columns:
        - column:
            name: "id"
            type: "uuid"
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: "user_id"
            type: "uuid"
            constraints:
              nullable: false
              foreignKeyName: "fk_todos_user"
              references: "users(id)"
              deleteCascade: true
        - column:
            name: "name"
            type: "varchar(200)"
            constraints:
              nullable: false
        - column:
            name: "description"
            type: "varchar(2000)"
        - column:
            name: "due_date"
            type: "date"
            constraints:
              nullable: false
        - column:
            name: "due_time"
            type: "time"
        - column:
            name: "priority"
            type: "varchar(10)"
            constraints:
              nullable: false
        - column:
            name: "category_id"
            type: "uuid"
        - column:
            name: "done"
            type: "boolean"
            defaultValueBoolean: false
        - column:
            name: "done_at"
            type: "timestamptz"
        - column:
            name: "created_at"
            type: "timestamptz"
            constraints:
              nullable: false
        - column:
            name: "updated_at"
            type: "timestamptz"
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: "todos"
        baseColumnNames: "category_id"
        constraintName: "fk_todos_category"
        referencedTableName: "categories"
        referencedColumnNames: "id"
        onDelete: "SET NULL"
    - createIndex:
        tableName: "todos"
        indexName: "ix_todos_user_due_date"
        columns:
        - column:
            name: "user_id"
        - column:
            name: "due_date"
