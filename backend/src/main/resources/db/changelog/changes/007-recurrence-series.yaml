---
databaseChangeLog:
- changeSet:
    id: "007-recurrence-series"
    author: "markitdone"
    changes:
    - createTable:
        tableName: "recurrence_series"
        columns:
        - column:
            name: "id"
            type: "uuid"
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: "user_id"
            type: "uuid"
            constraints:
              nullable: false
        - column:
            name: "name"
            type: "varchar(200)"
            constraints:
              nullable: false
        - column:
            name: "description"
            type: "varchar(2000)"
        - column:
            name: "due_time"
            type: "time"
        - column:
            name: "priority"
            type: "varchar(10)"
            constraints:
              nullable: false
        - column:
            name: "category_id"
            type: "uuid"
        - column:
            name: "frequency"
            type: "varchar(16)"
            constraints:
              nullable: false
        - column:
            name: "interval_days"
            type: "int"
        - column:
            name: "weekdays"
            type: "varchar(32)"
        - column:
            name: "month_days"
            type: "varchar(100)"
        - column:
            name: "start_date"
            type: "date"
            constraints:
              nullable: false
        - column:
            name: "end_type"
            type: "varchar(16)"
            constraints:
              nullable: false
        - column:
            name: "end_count"
            type: "int"
        - column:
            name: "end_date"
            type: "date"
        - column:
            name: "status"
            type: "varchar(16)"
            defaultValue: "ACTIVE"
            constraints:
              nullable: false
        - column:
            name: "cancelled_on"
            type: "date"
        - column:
            name: "materialized_until"
            type: "date"
        - column:
            name: "created_at"
            type: "timestamptz"
            constraints:
              nullable: false
        - column:
            name: "updated_at"
            type: "timestamptz"
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: "recurrence_series"
        baseColumnNames: "user_id"
        constraintName: "fk_series_user"
        referencedTableName: "users"
        referencedColumnNames: "id"
        onDelete: "CASCADE"
    - addForeignKeyConstraint:
        baseTableName: "recurrence_series"
        baseColumnNames: "category_id"
        constraintName: "fk_series_category"
        referencedTableName: "categories"
        referencedColumnNames: "id"
        onDelete: "SET NULL"
    - createIndex:
        tableName: "recurrence_series"
        indexName: "ix_series_user_status"
        columns:
        - column:
            name: "user_id"
        - column:
            name: "status"
    - addColumn:
        tableName: "todos"
        columns:
        - column:
            name: "series_id"
            type: "uuid"
        - column:
            name: "occurrence_date"
            type: "date"
        - column:
            name: "detached"
            type: "boolean"
            defaultValueBoolean: false
            constraints:
              nullable: false
    - addForeignKeyConstraint:
        baseTableName: "todos"
        baseColumnNames: "series_id"
        constraintName: "fk_todos_series"
        referencedTableName: "recurrence_series"
        referencedColumnNames: "id"
        onDelete: "CASCADE"
    - sql:
        sql: "CREATE UNIQUE INDEX uq_todos_series_slot ON todos (series_id, occurrence_date)\
          \ WHERE series_id IS NOT NULL"
        rollback: "DROP INDEX uq_todos_series_slot"
