---
databaseChangeLog:
- changeSet:
    id: "004-password-reset-tokens"
    author: "markitdone"
    changes:
    - createTable:
        tableName: "password_reset_tokens"
        columns:
        - column:
            name: "id"
            type: "uuid"
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: "user_id"
            type: "uuid"
            constraints:
              nullable: false
              foreignKeyName: "fk_password_reset_tokens_user"
              references: "users(id)"
              deleteCascade: true
        - column:
            name: "token_hash"
            type: "varchar(64)"
            constraints:
              nullable: false
              unique: true
              uniqueConstraintName: "uq_password_reset_tokens_token_hash"
        - column:
            name: "created_at"
            type: "timestamptz"
            constraints:
              nullable: false
        - column:
            name: "expires_at"
            type: "timestamptz"
            constraints:
              nullable: false
        - column:
            name: "used_at"
            type: "timestamptz"
    - createIndex:
        tableName: "password_reset_tokens"
        indexName: "ix_password_reset_tokens_user_id"
        columns:
        - column:
            name: "user_id"
