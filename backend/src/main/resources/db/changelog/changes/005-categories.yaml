---
databaseChangeLog:
- changeSet:
    id: "005-categories"
    author: "markitdone"
    changes:
    - createTable:
        tableName: "categories"
        columns:
        - column:
            name: "id"
            type: "uuid"
            constraints:
              primaryKey: true
              nullable: false
        - column:
            name: "user_id"
            type: "uuid"
            constraints:
              nullable: false
              foreignKeyName: "fk_categories_user"
              references: "users(id)"
              deleteCascade: true
        - column:
            name: "name"
            type: "varchar(40)"
            constraints:
              nullable: false
        - column:
            name: "name_key"
            type: "varchar(40)"
            constraints:
              nullable: false
        - column:
            name: "swatch"
            type: "varchar(16)"
            constraints:
              nullable: false
        - column:
            name: "created_at"
            type: "timestamptz"
            constraints:
              nullable: false
        - column:
            name: "updated_at"
            type: "timestamptz"
            constraints:
              nullable: false
    - addUniqueConstraint:
        tableName: "categories"
        columnNames: "user_id, name_key"
        constraintName: "uq_categories_user_name"
